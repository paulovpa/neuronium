<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronium | Entrar</title>
    <!-- página pública: o sessao.js não redireciona, só ajusta o header -->
    <script>var PAGINA_PUBLICA = true;</script>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/autenticacao.css">
</head>

<body class="pagina-autenticacao">

    <!-- header padrão: o nome leva ao início e os links levam às páginas de cada tema -->
    <nav id="menu_principal" class="header-logado">
        <div id="menu_conteudo">
            <div id="logo_nome">
                <a href="index.html">
                    <h1>Neuronium</h1>
                </a>
            </div>

            <ul id="menu_itens">
                <li class="menu-item">
                    <a href="universo_magico.html">
                        <span class="item-descricao">
                            Universo Mágico
                        </span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="neurociencia.html">
                        <span class="item-descricao">
                            Neurociência
                        </span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="minha_jornada.html">
                        <span class="item-descricao">
                            Jornada
                        </span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="a_conexao.html">
                        <span class="item-descricao">
                            A Conexão
                        </span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="palacio_mental.html">
                        <span class="item-descricao">
                            Palácio Mental
                        </span>
                    </a>
                </li>
            </ul>
        </div>

        <!-- ações à direita do header -->
        <div id="menu_acesso">
            <ul>
                <!-- link provisório: a tela do game ainda será criada -->
                <li class="menu-item jogar">
                    <a href="#" title="Em breve">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span class="item-descricao">
                            Jogar
                        </span>
                    </a>
                </li>
                <!-- visitante: Entrar e Cadastrar (o js/sessao.js esconde quando há login) -->
                <li class="menu-item entrar so-visitante active">
                    <a href="login.html">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        <span class="item-descricao">
                            Entrar
                        </span>
                    </a>
                </li>
                <li class="menu-item cadastrar so-visitante">
                    <a href="cadastro.html">
                        <span class="item-descricao">
                            Cadastrar
                        </span>
                    </a>
                </li>
                <!-- o logout apaga a sessão (js/sessao.js) e volta para a index -->
                <li class="menu-item sair so-logado">
                    <button id="botao_logout" type="button" onclick="limparSessao()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        <span class="item-descricao">
                            Sair
                        </span>
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main class="autenticacao">

        <section class="card-autenticacao card-login">

            <div class="cabecalho-autenticacao">
                <h2>Bem-vindo de volta</h2>
                <p>Entre para continuar a sua jornada no castelo.</p>
            </div>

            <!-- novalidate: as validações são feitas pelo script, com mensagens próprias -->
            <form id="form_login" class="formulario" onsubmit="return entrar()" novalidate>

                <div class="campo">
                    <label for="input_email">E-mail</label>
                    <input type="email" id="input_email" maxlength="100" placeholder="seuemail@exemplo.com"
                        autocomplete="email">
                    <span id="erro_email" class="mensagem-campo" aria-live="polite"></span>
                </div>

                <div class="campo">
                    <label for="input_senha">Senha</label>
                    <div class="campo-senha">
                        <input type="password" id="input_senha" maxlength="50" placeholder="Sua senha"
                            autocomplete="current-password">
                        <button type="button" class="botao-olho" onclick="alternarSenha('input_senha', this)"
                            aria-label="Mostrar senha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span id="erro_senha" class="mensagem-campo" aria-live="polite"></span>
                </div>

                <button type="submit" id="botao_entrar" class="botao-dourado">Entrar</button>

                <p id="mensagem_formulario" class="mensagem-formulario" role="alert"></p>
            </form>

            <p class="troca-tela">
                Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
            </p>

        </section>
    </main>

    <script src="js/login.js"></script>
</body>

</html>
