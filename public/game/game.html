<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game | Neuronium</title>
    <script src="../js/sessao.js"></script>
    <script src="../js/game/batalha.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="./../css/global.css">
    <link rel="stylesheet" href="./../css/game.css">

    <!-- <link rel="stylesheet" href="./../css/index.css"> -->



</head>

<body>
    <nav id="menu_lateral">
        <div id="menu_conteudo">
            <div id="logo_nome">
                <h1>Neuronium</h1>
            </div>
            <div id="usuario">
                <img src="./../assets/imgs/avatar_01.jpeg" id="usuario_avatar" alt="Avatar">

                <p id="usuario_infos">
                    <span class="item-descricao">
                        Paulo
                    </span>
                    <span class="item-descricao">
                        Mago Soberano
                    </span>
                </p>
            </div>

            <ul id="menu_itens">
                <li class="menu-item">
                    <a href="../index.html">
                        <i class="fa-solid fa-house"></i>
                        <span class="item-descricao">
                            Início
                        </span>
                    </a>
                </li>
                <li class="menu-item active">
                    <a href="game.html">
                        <i class="fa-brands fa-fort-awesome"></i>
                        <span class="item-descricao">
                            Mentalis Game
                        </span>
                    </a>
                </li>
                <li class="menu-item">
                    <a href="../dashboard/dashboard.html">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="item-descricao">
                            Dashboard
                        </span>
                    </a>
                </li>
            </ul>

        </div>

        <div id="logout">
            <button id="botao_logout" onclick="limparSessao()">
                <span>
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span class="item-descricao">
                        Logout
                    </span>
                </span>
            </button>
        </div>

    </nav>
    <main>



        <div id="div_area">

            <div id="div_game">




                <div id="heroi">
                    <div class="barras">
                        <span class="titulo_barra_hp">HP</span>
                        <div class="borda-hp">
                            <div id="heroi_hp" class="barra-cheia">100</div>
                        </div>

                        <span class="titulo_barra_magia">MAGIA</span>
                        <div class="borda-magia">
                            <div id="heroi_magia" class="barra-cheia">100</div>
                        </div>

                        <span class="titulo_barra_energia">ENERGIA</span>
                        <div class="borda-energia">
                            <div id="heroi_energia" class="barra-cheia">100</div>
                        </div>

                    </div>

                    <div id="img_heroi">
                        <img width="300" src="../assets/game/heroi.gif" draggable="false">
                    </div>

                    <div id="feiticos" class="feiticos_on">


                        <button id="feitico_1" onclick="usarCafeinus()">
                            <span>Cafeinus</span>
                            <img width="100px" src="../assets/game/itens/cafe.webp">

                        </button>

                        <button id="feitico_2" onclick="usarMeditus()">
                            <span>Meditus</span>
                            <img width="50px" src="../assets/game/itens/meditus.png">
                        </button>

                        <button id="feitico_3" onclick="usarScrollum()">
                            <span>Scrollum</span>
                            <img width="70px" src="../assets/game/itens/scrollum.png">
                        </button>

                    </div>
                </div>

                <div id="vilao">
                    <div class="barras">
                        <span class="titulo_barra_hp">HP</span>
                        <div class="borda-hp">
                            <div id="vilao_hp" class="barra-cheia">100</div>
                        </div>

                    </div>

                    <div id="img_vilao">
                        <img width="300" src="../assets/game/vilao.gif" draggable="false">
                    </div>
                </div>

            </div>
        </div>

    </main>
</body>

</html>
<script>

    let hpHeroi = 100;
    let magiaHeroi = 100;
    let energiaHeroi = 100;

    let hpVilao = 100;

    let listaFeitico = ['cafeinus', 'meditus', 'scrollum'];
    let listaFeiticoHp = ['25', '25', '25'];
    let listaFeiticoMagia = ['25', '25', '25'];
    let listaFeiticoEnergia = ['25', '25', '25'];
    let listaFeiticoDano = ['50', '50', '50'];

    let listaFeiticoVilao = ['scrollum infinitus', 'desfocus', 'procrastinus'];
    let listaFeiticoDanoVilao = ['25', '25', '25'];
    let listaFeiticoMagiaVilao = ['25', '25', '25'];


    function verificarHpHeroi() {
        if (hpHeroi <= 0) {
            console.log("Herói derrotado");
        } else if (hpHeroi < 25) {
            console.log("Herói com a vida crítica");
        } else if (hpHeroi < 50) {
            console.log("Herói com a vida baixa");
        } else if (hpHeroi < 75) {
            console.log("Herói com a vida média");
        } else if (hpHeroi < 100) {
            console.log("Herói com a vida alta");
        } else {
            console.log("Herói com a vida cheia");
        }
    }

    function usarCafeinus() {

        if (magiaHeroi >= listaFeiticoMagia[0] && hpVilao > 0) {


            magiaHeroi -= listaFeiticoMagia[0];
            energiaHeroi -= listaFeiticoEnergia[0];
            hpVilao -= listaFeiticoDano[0];

            if (magiaHeroi <= 25) {
                heroi_magia.className = "barra-critica"
            } else if (magiaHeroi <= 50) {
                heroi_magia.className = "barra-baixa"
            } else if (magiaHeroi <= 75) {
                heroi_magia.className = "barra-media"
            } else if (magiaHeroi < 100) {
                heroi_magia.className = "barra-alta"
            } else {
                heroi_magia.className = "barra-cheia"
            }

            if (energiaHeroi <= 25) {
                heroi_energia.className = "barra-critica"
            } else if (energiaHeroi <= 50) {
                heroi_energia.className = "barra-baixa"
            } else if (energiaHeroi <= 75) {
                heroi_energia.className = "barra-media"
            } else if (energiaHeroi < 100) {
                heroi_energia.className = "barra-alta"
            } else {
                heroi_energia.className = "barra-cheia"
            }


            if (hpVilao <= 25) {
                vilao_hp.className = "barra-critica"
            } else if (hpVilao <= 75) {
                vilao_hp.className = "barra-media"
            } else {
                vilao_hp.className = "barra-cheia"
            }

            if (hpVilao < 0) {
                hpVilao = 0;
            }

            heroi_magia.innerHTML = `${magiaHeroi}`;
            heroi_energia.innerHTML = `${energiaHeroi}`;
            vilao_hp.innerHTML = `${hpVilao}`;
            


            if (hpVilao == 0) {
                img_vilao.classList.add("derrotado");

                setTimeout(function () {
                    alert('GANHOU');
                }, 1000);
            } else {

                desativarFeiticos()
                setTimeout(function () {
                    trocaTurnoVilao();
                }, 1000);


            }

        }

    }

    function desativarFeiticos() {
        feiticos.className = "feiticos_off"

        feitico_1.disabled = true;
        feitico_2.disabled = true;
        feitico_3.disabled = true;
    }

    function ativarFeiticos() {
        feiticos.className = "feiticos_on"

        feitico_1.disabled = false;
        feitico_2.disabled = false;
        feitico_3.disabled = false;
    }

    function trocaTurnoVilao() {

        alert('Troca de Turno');

        setTimeout(function () {

            hpHeroi -= listaFeiticoDanoVilao[0]
            magiaHeroi -= listaFeiticoMagiaVilao[0]

            if (hpHeroi <= 25) {
                heroi_hp.className = "barra-critica"
            } else if (hpHeroi <= 50) {
                heroi_hp.className = "barra-baixa"
            } else if (hpHeroi <= 75) {
                heroi_hp.className = "barra-media"
            } else if (hpHeroi < 100) {
                heroi_hp.className = "barra-alta"
            } else {
                heroi_hp.className = "barra-cheia"
            }


            if (magiaHeroi <= 25) {
                heroi_magia.className = "barra-critica"
            } else if (magiaHeroi <= 50) {
                heroi_magia.className = "barra-baixa"
            } else if (magiaHeroi <= 75) {
                heroi_magia.className = "barra-media"
            } else if (magiaHeroi < 100) {
                heroi_magia.className = "barra-alta"
            } else {
                heroi_magia.className = "barra-cheia"
            }


            if (hpHeroi < 0) {
                hpHeroi = 0;
            }

            heroi_hp.innerHTML = `${hpHeroi}`;
            heroi_magia.innerHTML = `${magiaHeroi}`;

            if (hpHeroi == 0) {
                img_heroi.classList.add("derrotado");

                setTimeout(function () {
                    alert('PERDEU');
                }, 1000);
            } else {

                setTimeout(function () {

                    alert('SUA VEZ')
                    ativarFeiticos()
                }, 1000);


            }

        }, 2000);



    }

    function mostrarResultado() {

    }
</script>
